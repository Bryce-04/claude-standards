name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          brew install swiftlint
          swiftlint --strict
      - name: Build and test
        run: |
          xcodebuild test \
            -scheme "<YourScheme>" \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            -resultBundlePath TestResults
